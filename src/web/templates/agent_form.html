{% extends "base.html" %}
{% block title %}{% if agent %}编辑经纪{% else %}添加经纪{% endif %} - 加拿大活动管理{% endblock %}

{% block content %}
<h1 class="text-xl font-bold text-gray-800 mb-4">{% if agent %}编辑经纪{% else %}添加经纪{% endif %}</h1>

<div class="bg-white rounded-lg border p-6 max-w-xl">
    <form action="{% if agent %}/agents/{{ agent.id }}/update{% else %}/agents/create{% endif %}" method="post" id="agent-form">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Realtor.ca IndividualId *</label>
            <input type="text" name="agent_id" value="{{ agent.agent_id if agent else '' }}" required class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">姓名（英文）*</label>
            <input type="text" name="name" value="{{ agent.name if agent else '' }}" required class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">中文名</label>
            <input type="text" name="name_zh" value="{{ agent.name_zh or '' }}" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">经纪公司</label>
            <input type="text" name="brokerage" value="{{ agent.brokerage or '' }}" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">电话</label>
            <input type="text" name="phone" value="{{ agent.phone or '' }}" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
            <input type="text" name="email" value="{{ agent.email or '' }}" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">覆盖城市（逗号分隔，如 saskatoon,toronto）</label>
            <input type="text" name="city_slugs" value="{% if agent and agent.city_slugs %}{{ agent.city_slugs | replace('[', '') | replace(']', '') | replace('"', '') }}{% endif %}" class="w-full border rounded px-3 py-2 text-sm">
            <p class="text-xs text-gray-500 mt-1">可选: {% for slug in cities.keys() %}{{ slug }}{% if not loop.last %}, {% endif %}{% endfor %}</p>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">省份代码</label>
            <input type="text" name="province_code" value="{{ agent.province_code or '' }}" placeholder="sk/on/bc" class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div class="mb-4">
            <label class="flex items-center gap-2">
                <input type="checkbox" name="is_active" {% if not agent or agent.is_active %}checked{% endif %} class="rounded border-gray-300">
                <span class="text-sm text-gray-700">启用</span>
            </label>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
            <textarea name="notes" rows="2" class="w-full border rounded px-3 py-2 text-sm">{{ agent.notes or '' }}</textarea>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">保存</button>
            <a href="/agents" class="bg-gray-100 text-gray-700 px-6 py-2 rounded text-sm hover:bg-gray-200">取消</a>
        </div>
    </form>
    <script>
    (function() {
        var form = document.getElementById('agent-form');
        if (!form) return;
        form.addEventListener('submit', function(e) {
            var data = new FormData(form);
            var entries = {};
            data.forEach(function(value, key) {
                entries[key] = value;
            });
            console.log('[agent_form] submit entries:', entries);
        });
    })();
    </script>
</div>
{% endblock %}
